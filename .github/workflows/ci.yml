name: ci

# The same gate as `make check`, run on every push to main and on pull requests,
# so a regression cannot ride in on a direct-to-main push unnoticed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt + vet + race tests
        run: make check
      - name: module checksums
        run: go mod verify
      - name: shellcheck the dev helpers
        run: shellcheck $(git ls-files 'minions/*.sh' 'minions/**/*.sh')

  # Advisory: known-vulnerability scan of the dependency graph. A finding here
  # is information, not a red build.
  vuln:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
